<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李欣 ❤️ 王雅婷 | Love Story</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rosegold: {
              50: '#fdf4f7',
              100: '#f8e9ee',
              300: '#d6a0ad',
              500: '#b56f7f',
              700: '#844f5c'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
    }
    .dark .glass {
      background: rgba(16, 16, 16, 0.72);
    }
    .soft-card {
      border-radius: 1.25rem;
      border: 1px solid rgba(0, 0, 0, 0.06);
      background: #fafafa;
      transition: transform .3s ease, box-shadow .3s ease;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .04);
    }
    .soft-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(181, 111, 127, .12);
    }
    .dark .soft-card {
      background: #171717;
      border-color: rgba(255, 255, 255, 0.08);
    }
    .gallery-item img {
      transition: transform .45s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    .hidden-scrollbar::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
    #lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-140px) scale(.35); opacity: 0; }
    }
    .heart-particle {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      animation: rise 2.1s ease-out forwards;
      font-size: 1.25rem;
    }
  </style>
</head>
<body class="bg-white text-neutral-900 dark:bg-black dark:text-white">
  <audio id="bgm" loop preload="none">
    <source src="/static/love_song.mp3" type="audio/mpeg">
  </audio>

  <nav class="glass fixed top-0 inset-x-0 z-40 border-b border-white/20 dark:border-white/10">
    <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <span class="text-lg">❤️</span>
        <span>李欣 <span class="text-rosegold-500">&</span> 王雅婷</span>
      </a>
      <div id="public-nav-links" class="hidden md:flex items-center gap-6 text-sm text-neutral-500 dark:text-neutral-300">
        <a href="#timeline" class="hover:text-rosegold-500 transition-colors">时光机</a>
        <a href="#gallery" class="hover:text-rosegold-500 transition-colors">相册</a>
        <a href="#wishlist" class="hover:text-rosegold-500 transition-colors">心愿单</a>
        <a href="#messages" class="hover:text-rosegold-500 transition-colors">留言板</a>
      </div>
      <div class="flex items-center gap-2">
        <button id="music-btn" type="button" class="w-9 h-9 rounded-full bg-rosegold-50 text-rosegold-700 dark:bg-neutral-800 dark:text-rosegold-300 flex items-center justify-center hover:-translate-y-1 transition-all duration-300">
          <i data-lucide="music-2" class="w-4 h-4"></i>
        </button>
        <a href="/admin" class="w-9 h-9 rounded-full bg-rosegold-50 text-rosegold-700 dark:bg-neutral-800 dark:text-rosegold-300 flex items-center justify-center hover:-translate-y-1 transition-all duration-300">
          <i data-lucide="shield" class="w-4 h-4"></i>
        </a>
      </div>
    </div>
  </nav>

  <main id="public-app" class="pt-16">
    <section class="min-h-[82vh] flex items-center">
      <div class="max-w-6xl mx-auto px-6 py-20 w-full">
        <p class="text-rosegold-500 text-sm tracking-[0.25em] uppercase mb-6">Love Story</p>
        <h1 class="text-5xl md:text-7xl font-bold tracking-tight leading-tight mb-5">李欣 与 王雅婷</h1>
        <p class="text-neutral-600 dark:text-neutral-300 text-lg md:text-xl mb-10">从 2022-12-25 开始，我们一直在写同一本故事书。</p>
        <div class="grid sm:grid-cols-2 gap-4 max-w-2xl">
          <div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">
            <p class="text-sm text-neutral-500 mb-2">在一起的天数</p>
            <p id="days-count" class="text-4xl font-bold tracking-tight">--</p>
          </div>
          <div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">
            <p class="text-sm text-neutral-500 mb-2">距离下个周年</p>
            <p id="anniversary-countdown" class="text-2xl font-bold tracking-tight">--</p>
          </div>
        </div>
      </div>
    </section>

    <section id="timeline" class="py-24 bg-neutral-50 dark:bg-neutral-950">
      <div class="max-w-5xl mx-auto px-6">
        <div class="mb-12">
          <p class="text-rosegold-500 text-xs tracking-[0.25em] uppercase">Timeline</p>
          <h2 class="text-4xl md:text-5xl font-bold tracking-tight mt-2">恋爱时光机</h2>
        </div>
        <div id="timeline-list" class="space-y-6"></div>
      </div>
    </section>

    <section id="gallery" class="py-24">
      <div class="max-w-6xl mx-auto px-6">
        <div class="mb-12">
          <p class="text-rosegold-500 text-xs tracking-[0.25em] uppercase">Photo Gallery</p>
          <h2 class="text-4xl md:text-5xl font-bold tracking-tight mt-2">交互式相册</h2>
        </div>
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </section>

    <section id="wishlist" class="py-24 bg-neutral-50 dark:bg-neutral-950">
      <div class="max-w-4xl mx-auto px-6">
        <div class="mb-12">
          <p class="text-rosegold-500 text-xs tracking-[0.25em] uppercase">Wishlist</p>
          <h2 class="text-4xl md:text-5xl font-bold tracking-tight mt-2">恋爱心愿单</h2>
        </div>
        <div id="wishlist-list" class="grid md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <section id="messages" class="py-24">
      <div class="max-w-3xl mx-auto px-6">
        <div class="mb-12">
          <p class="text-rosegold-500 text-xs tracking-[0.25em] uppercase">Message Board</p>
          <h2 class="text-4xl md:text-5xl font-bold tracking-tight mt-2">留言板</h2>
        </div>
        <div class="soft-card p-6 mb-6 bg-neutral-50 dark:bg-neutral-900">
          <div class="space-y-3">
            <input id="message-nickname" maxlength="20" class="w-full rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300" placeholder="昵称">
            <textarea id="message-content" maxlength="500" rows="4" class="w-full rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300 resize-none" placeholder="写下想说的话"></textarea>
            <button id="message-submit" class="w-full rounded-xl bg-rosegold-500 hover:bg-rosegold-700 text-white py-3 font-semibold hover:-translate-y-1 transition-all duration-300">发送留言</button>
          </div>
        </div>
        <div id="message-list" class="space-y-4"></div>
      </div>
    </section>
  </main>

  <section id="admin-app" class="hidden pt-24 pb-16">
    <div class="max-w-5xl mx-auto px-6">
      <div class="mb-10">
        <p class="text-rosegold-500 text-xs tracking-[0.25em] uppercase">Admin Backstage</p>
        <h2 class="text-4xl md:text-5xl font-bold tracking-tight mt-2">秘密管理后台</h2>
      </div>

      <div id="admin-login-box" class="soft-card p-7 max-w-md bg-neutral-50 dark:bg-neutral-900">
        <p class="text-sm text-neutral-500 mb-3">输入口令以管理时光机、照片和留言审核。</p>
        <input id="admin-password" type="password" class="w-full rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300" placeholder="管理员口令">
        <button id="admin-login-btn" class="mt-3 w-full rounded-xl bg-rosegold-500 hover:bg-rosegold-700 text-white py-3 font-semibold hover:-translate-y-1 transition-all duration-300">登录后台</button>
        <p id="admin-login-error" class="text-sm text-red-500 mt-2 min-h-[20px]"></p>
      </div>

      <div id="admin-panel" class="hidden space-y-6">
        <div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">
          <h3 class="text-2xl font-bold tracking-tight mb-4">新增时光机节点</h3>
          <div class="grid md:grid-cols-2 gap-3">
            <input id="timeline-date" type="date" class="rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300">
            <input id="timeline-title" maxlength="120" class="rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300" placeholder="标题">
            <textarea id="timeline-description" rows="4" maxlength="2000" class="md:col-span-2 rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300 resize-none" placeholder="描述"></textarea>
            <input id="timeline-image" class="md:col-span-2 rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300" placeholder="图片 URL 或 data:image/...base64,...">
          </div>
          <div class="mt-4 flex flex-wrap items-center gap-3">
            <input id="upload-file" type="file" accept="image/*" class="text-sm">
            <select id="upload-mode" class="rounded-xl px-3 py-2 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950">
              <option value="file">保存为本地文件</option>
              <option value="base64">转为 Base64</option>
            </select>
            <button id="upload-btn" class="rounded-xl px-4 py-2 bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 hover:-translate-y-1 transition-all duration-300">上传图片并回填</button>
          </div>
          <button id="timeline-add-btn" class="mt-4 rounded-xl bg-rosegold-500 hover:bg-rosegold-700 text-white px-5 py-3 font-semibold hover:-translate-y-1 transition-all duration-300">添加节点</button>
        </div>

        <div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">
          <h3 class="text-2xl font-bold tracking-tight mb-4">新增心愿</h3>
          <div class="flex gap-3">
            <input id="wish-title" maxlength="120" class="flex-1 rounded-xl px-4 py-3 border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-950 outline-none focus:ring-2 focus:ring-rosegold-300" placeholder="例如：去看极光">
            <button id="wish-add-btn" class="rounded-xl px-4 py-3 bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 hover:-translate-y-1 transition-all duration-300">添加</button>
          </div>
        </div>

        <div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">
          <h3 class="text-2xl font-bold tracking-tight mb-4">留言审核</h3>
          <div id="admin-message-list" class="space-y-3 max-h-[420px] overflow-y-auto hidden-scrollbar"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="lightbox" class="fixed inset-0 opacity-0 pointer-events-none transition-opacity duration-300 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
    <button id="lb-close" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    <button id="lb-zoom-out" class="absolute bottom-5 left-1/2 -translate-x-16 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center">
      <i data-lucide="zoom-out" class="w-5 h-5"></i>
    </button>
    <button id="lb-zoom-in" class="absolute bottom-5 left-1/2 translate-x-16 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center">
      <i data-lucide="zoom-in" class="w-5 h-5"></i>
    </button>
    <img id="lightbox-image" class="max-w-[92vw] max-h-[88vh] rounded-2xl object-contain transition-transform duration-200" alt="photo">
  </div>

  <div id="toast" class="fixed z-[70] bottom-6 left-1/2 -translate-x-1/2 bg-neutral-900 text-white text-sm px-4 py-2 rounded-full opacity-0 transition-opacity duration-300 pointer-events-none"></div>

  <script>
    const ANNIVERSARY = new Date('2022-12-25T00:00:00');
    const IS_ADMIN_ROUTE = window.location.pathname === '/admin';
    const PUBLIC_APP = document.getElementById('public-app');
    const ADMIN_APP = document.getElementById('admin-app');
    const PUBLIC_NAV_LINKS = document.getElementById('public-nav-links');

    let adminToken = '';
    let toastTimer = null;
    let lbScale = 1;

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2500);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function updateCounters() {
      const now = new Date();
      const days = Math.floor((now - ANNIVERSARY) / 86400000);
      document.getElementById('days-count').textContent = days.toLocaleString();

      const next = new Date(ANNIVERSARY);
      next.setFullYear(now.getFullYear());
      if (next <= now) next.setFullYear(now.getFullYear() + 1);
      const diff = Math.max(0, next - now);
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('anniversary-countdown').textContent = `${d}天 ${h}时 ${m}分 ${s}秒`;
    }

    function bindMusic() {
      const btn = document.getElementById('music-btn');
      const bgm = document.getElementById('bgm');
      let playing = false;
      btn.addEventListener('click', async () => {
        if (!playing) {
          try {
            await bgm.play();
            playing = true;
            btn.classList.add('bg-rosegold-100');
          } catch (error) {
            toast('浏览器阻止了自动播放，请再次点击');
          }
        } else {
          bgm.pause();
          playing = false;
          btn.classList.remove('bg-rosegold-100');
        }
      });
    }

    async function getJson(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || '请求失败');
      return data;
    }

    async function loadTimeline() {
      const list = document.getElementById('timeline-list');
      const items = await getJson('/api/timeline');
      if (!items.length) {
        list.innerHTML = '<div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">暂无时光机记录</div>';
        return;
      }
      list.innerHTML = items.map(item => `
        <article class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">
          <p class="text-rosegold-500 text-xs tracking-[0.2em] uppercase mb-3">${escapeHtml(item.date)}</p>
          <h3 class="text-2xl font-bold tracking-tight mb-3">${escapeHtml(item.title)}</h3>
          ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" class="rounded-xl mb-4 w-full max-h-[360px] object-cover cursor-zoom-in" onclick="openLightbox('${escapeHtml(item.image)}')">` : ''}
          <p class="text-neutral-600 dark:text-neutral-300 leading-relaxed">${escapeHtml(item.description)}</p>
        </article>
      `).join('');
    }

    async function loadGallery() {
      const grid = document.getElementById('gallery-grid');
      const images = await getJson('/api/gallery');
      if (!images.length) {
        grid.innerHTML = '<div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">暂无可展示照片</div>';
        return;
      }
      grid.innerHTML = images.map((src, index) => `
        <button class="gallery-item soft-card overflow-hidden bg-neutral-100 dark:bg-neutral-900 aspect-square" onclick="openLightbox('${escapeHtml(src)}')" aria-label="open photo ${index + 1}">
          <img src="${escapeHtml(src)}" alt="photo-${index + 1}" class="w-full h-full object-cover">
        </button>
      `).join('');
    }

    async function loadWishlist() {
      const list = document.getElementById('wishlist-list');
      const items = await getJson('/api/wishlist');
      list.innerHTML = items.map(item => `
        <button class="soft-card p-5 bg-neutral-50 dark:bg-neutral-900 text-left" onclick="toggleWish(${item.id}, ${item.completed ? 'false' : 'true'})">
          <div class="flex items-start gap-3">
            <div class="w-6 h-6 rounded-full border ${item.completed ? 'bg-green-500 border-green-500' : 'border-neutral-300'} flex items-center justify-center text-white mt-1">
              ${item.completed ? '✓' : ''}
            </div>
            <div>
              <p class="font-semibold text-lg tracking-tight ${item.completed ? 'line-through text-neutral-500' : ''}">${escapeHtml(item.title)}</p>
              <p class="text-sm text-neutral-500 mt-1">${item.completed && item.completed_at ? `完成于 ${escapeHtml(item.completed_at)}` : '点击即可勾选完成'}</p>
            </div>
          </div>
        </button>
      `).join('');
    }

    async function toggleWish(id, nextValue) {
      try {
        await getJson(`/api/wishlist/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: nextValue })
        });
        await loadWishlist();
      } catch (error) {
        toast(error.message);
      }
    }

    function renderMessageCard(item, adminMode = false) {
      const when = (item.updated_at || item.created_at || '').slice(0, 16);
      return `
        <article class="soft-card p-5 bg-neutral-50 dark:bg-neutral-900">
          <div class="flex justify-between gap-3">
            <div class="min-w-0">
              <p class="font-semibold">${escapeHtml(item.nickname)}</p>
              <p class="text-sm text-neutral-500 mt-1 break-words">${escapeHtml(item.content)}</p>
              <p class="text-xs text-neutral-400 mt-2">${escapeHtml(when)}</p>
            </div>
            ${adminMode ? `<button onclick="adminDeleteMessage(${item.id})" class="w-9 h-9 rounded-xl bg-red-50 text-red-500 flex items-center justify-center hover:-translate-y-1 transition-all duration-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
          </div>
        </article>
      `;
    }

    async function loadMessages() {
      const container = document.getElementById('message-list');
      const items = await getJson('/api/messages');
      container.innerHTML = items.length ? items.map(item => renderMessageCard(item)).join('') : '<div class="soft-card p-6 bg-neutral-50 dark:bg-neutral-900">还没有留言，来写第一条吧。</div>';
      lucide.createIcons();
    }

    function launchMessageCelebration() {
      confetti({
        particleCount: 120,
        spread: 85,
        origin: { y: 0.72 },
        colors: ['#fdf4f7', '#d6a0ad', '#b56f7f', '#ffffff']
      });
      const icons = ['❤️', '💗', '💕', '💖', '✨'];
      for (let i = 0; i < 14; i += 1) {
        setTimeout(() => {
          const node = document.createElement('div');
          node.className = 'heart-particle';
          node.textContent = icons[Math.floor(Math.random() * icons.length)];
          node.style.left = `${10 + Math.random() * 80}vw`;
          node.style.top = '75vh';
          document.body.appendChild(node);
          setTimeout(() => node.remove(), 2300);
        }, i * 100);
      }
    }

    async function submitMessage() {
      const nickname = document.getElementById('message-nickname').value.trim();
      const content = document.getElementById('message-content').value.trim();
      if (!nickname || !content) {
        toast('昵称和内容不能为空');
        return;
      }
      try {
        await getJson('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, content })
        });
        document.getElementById('message-nickname').value = '';
        document.getElementById('message-content').value = '';
        launchMessageCelebration();
        toast('留言成功，感谢祝福');
        await loadMessages();
      } catch (error) {
        toast(error.message);
      }
    }

    function setAdminUI(loggedIn) {
      document.getElementById('admin-login-box').classList.toggle('hidden', loggedIn);
      document.getElementById('admin-panel').classList.toggle('hidden', !loggedIn);
    }

    async function adminLogin() {
      const passwordInput = document.getElementById('admin-password');
      const errorEl = document.getElementById('admin-login-error');
      const password = passwordInput.value;
      if (!password) {
        errorEl.textContent = '请输入口令';
        return;
      }
      try {
        const data = await getJson('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        adminToken = data.token;
        errorEl.textContent = '';
        passwordInput.value = '';
        setAdminUI(true);
        await Promise.all([loadTimeline(), loadGallery(), loadWishlist(), loadMessages(), loadAdminMessages()]);
        toast('后台登录成功');
      } catch (error) {
        errorEl.textContent = error.message;
      }
    }

    async function uploadAndFillTimelineImage() {
      const input = document.getElementById('upload-file');
      const mode = document.getElementById('upload-mode').value;
      if (!adminToken) return toast('请先登录后台');
      if (!input.files || !input.files[0]) return toast('请先选择图片');

      const form = new FormData();
      form.append('file', input.files[0]);
      form.append('mode', mode);
      try {
        const response = await fetch('/api/admin/upload-photo', {
          method: 'POST',
          headers: { 'X-Admin-Token': adminToken },
          body: form
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || '上传失败');
        document.getElementById('timeline-image').value = data.url;
        input.value = '';
        toast(mode === 'base64' ? '已转为 Base64 并回填' : '上传成功并回填图片地址');
      } catch (error) {
        toast(error.message);
      }
    }

    async function addTimelineItem() {
      if (!adminToken) return toast('请先登录后台');
      const date = document.getElementById('timeline-date').value;
      const title = document.getElementById('timeline-title').value.trim();
      const description = document.getElementById('timeline-description').value.trim();
      const image = document.getElementById('timeline-image').value.trim();
      if (!date || !title || !description) return toast('请填写日期、标题、描述');

      try {
        await getJson('/api/admin/timeline', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': adminToken
          },
          body: JSON.stringify({ date, title, description, image })
        });
        document.getElementById('timeline-date').value = '';
        document.getElementById('timeline-title').value = '';
        document.getElementById('timeline-description').value = '';
        document.getElementById('timeline-image').value = '';
        await Promise.all([loadTimeline(), loadGallery()]);
        toast('时光机节点已添加');
      } catch (error) {
        toast(error.message);
      }
    }

    async function addWish() {
      if (!adminToken) return toast('请先登录后台');
      const titleEl = document.getElementById('wish-title');
      const title = titleEl.value.trim();
      if (!title) return toast('请输入心愿标题');
      try {
        await getJson('/api/admin/wishlist', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': adminToken
          },
          body: JSON.stringify({ title })
        });
        titleEl.value = '';
        await loadWishlist();
        toast('心愿已添加');
      } catch (error) {
        toast(error.message);
      }
    }

    async function loadAdminMessages() {
      const container = document.getElementById('admin-message-list');
      const items = await getJson('/api/messages');
      container.innerHTML = items.length ? items.map(item => renderMessageCard(item, true)).join('') : '<p class="text-sm text-neutral-500">暂无留言</p>';
      lucide.createIcons();
    }

    async function adminDeleteMessage(id) {
      if (!adminToken) return toast('请先登录后台');
      if (!window.confirm('确认删除这条留言吗？')) return;
      try {
        await getJson(`/api/admin/messages/${id}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Token': adminToken }
        });
        await Promise.all([loadMessages(), loadAdminMessages()]);
        toast('留言已删除');
      } catch (error) {
        toast(error.message);
      }
    }

    window.adminDeleteMessage = adminDeleteMessage;

    function openLightbox(src) {
      const box = document.getElementById('lightbox');
      const image = document.getElementById('lightbox-image');
      lbScale = 1;
      image.style.transform = 'scale(1)';
      image.src = src;
      box.classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function applyZoom(delta) {
      lbScale = Math.max(0.8, Math.min(3, lbScale + delta));
      document.getElementById('lightbox-image').style.transform = `scale(${lbScale})`;
    }

    window.openLightbox = openLightbox;

    function bindLightbox() {
      const box = document.getElementById('lightbox');
      const image = document.getElementById('lightbox-image');
      document.getElementById('lb-close').addEventListener('click', closeLightbox);
      document.getElementById('lb-zoom-in').addEventListener('click', () => applyZoom(0.2));
      document.getElementById('lb-zoom-out').addEventListener('click', () => applyZoom(-0.2));
      box.addEventListener('click', (event) => { if (event.target === box) closeLightbox(); });
      box.addEventListener('wheel', (event) => {
        if (!box.classList.contains('open')) return;
        event.preventDefault();
        applyZoom(event.deltaY < 0 ? 0.12 : -0.12);
      }, { passive: false });
      image.addEventListener('dblclick', () => {
        lbScale = lbScale > 1 ? 1 : 2;
        image.style.transform = `scale(${lbScale})`;
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeLightbox();
      });
    }

    function mountAdminOrPublic() {
      if (IS_ADMIN_ROUTE) {
        PUBLIC_APP.classList.add('hidden');
        PUBLIC_NAV_LINKS.classList.add('hidden');
        ADMIN_APP.classList.remove('hidden');
      } else {
        PUBLIC_APP.classList.remove('hidden');
        ADMIN_APP.classList.add('hidden');
      }
    }

    async function bootstrap() {
      mountAdminOrPublic();
      updateCounters();
      setInterval(updateCounters, 1000);
      bindMusic();
      bindLightbox();
      lucide.createIcons();
      if (!IS_ADMIN_ROUTE) {
        await Promise.all([loadTimeline(), loadGallery(), loadWishlist(), loadMessages()]);
      } else {
        document.getElementById('admin-login-btn').addEventListener('click', adminLogin);
        document.getElementById('admin-login-btn').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') adminLogin();
        });
      }

      document.getElementById('message-submit').addEventListener('click', submitMessage);
      document.getElementById('upload-btn').addEventListener('click', uploadAndFillTimelineImage);
      document.getElementById('timeline-add-btn').addEventListener('click', addTimelineItem);
      document.getElementById('wish-add-btn').addEventListener('click', addWish);
    }

    bootstrap().catch(error => {
      toast(error.message || '页面初始化失败');
    });
  </script>
</body>
</html>
