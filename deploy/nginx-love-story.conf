# Install under /etc/nginx/conf.d/ or another path included from nginx's `http`
# context. Replace love.example.com and certificate paths before enabling it.

map "$request_method:$uri" $love_login_key {
    default "";
    "POST:/api/admin/login" $binary_remote_addr;
}

map "$request_method:$uri" $love_message_write_key {
    default "";
    "POST:/api/messages" $binary_remote_addr;
}

map "$request_method:$uri" $love_upload_key {
    default "";
    "POST:/api/admin/upload" $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=love_general:1m rate=10r/s;
limit_req_zone $love_login_key zone=love_login:1m rate=5r/m;
limit_req_zone $love_message_write_key zone=love_message_write:1m rate=10r/m;
limit_req_zone $love_upload_key zone=love_upload:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=love_connections:1m;
limit_conn_zone $love_upload_key zone=love_upload_connections:1m;

upstream love_story_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name love.example.com www.love.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://love.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name love.example.com www.love.example.com;

    ssl_certificate /etc/letsencrypt/live/love.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/love.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LOVE_SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # Multipart framing may add overhead; the app still caps decoded images at
    # 5 MiB and rejects request bodies above 6 MiB.
    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 30s;
    sendfile on;
    tcp_nopush on;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn love_connections 20;

    access_log /var/log/nginx/love-story-access.log;
    error_log /var/log/nginx/love-story-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Entry assets keep stable names and must revalidate after every deployment.
    location = /static/app.js {
        alias /opt/love-story/current/static/app.js;
        expires -1;
        access_log off;
    }

    location = /static/site.css {
        alias /opt/love-story/current/static/site.css;
        expires -1;
        access_log off;
    }

    # Versioned vendor files and generated uploaded names may be cached longer.
    location ^~ /static/vendor/ {
        alias /opt/love-story/current/static/vendor/;
        expires 30d;
        access_log off;
    }

    location ^~ /static/ {
        alias /opt/love-story/current/static/;
        expires 7d;
        access_log off;
    }

    location ^~ /photos/ {
        alias /var/lib/love-story/photos/;
        expires 30d;
        access_log off;
    }

    location / {
        limit_req zone=love_general burst=20 nodelay;
        limit_req zone=love_login burst=3 nodelay;
        limit_req zone=love_message_write burst=5 nodelay;
        limit_req zone=love_upload burst=1 nodelay;
        limit_conn love_upload_connections 1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This host has exactly one trusted proxy hop. Discard any client-supplied
        # X-Forwarded-For value so application rate limits cannot be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass http://love_story_app;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
